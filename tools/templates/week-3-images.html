<!-- 6: presence -->
<div class="ab" id="img6"><svg width="1080" height="1080">
 <g id="pres" transform="translate(150,190)"></g>
</svg><img class="mark" src="logo.png"></div>

<script>
// img3 dots
const c1=document.getElementById('col1'),c2=document.getElementById('col2');
const first='gggogggoogggogog';
[...first].forEach((c,i)=>{const x=(i%4)*75,y=Math.floor(i/4)*130;
 c1.insertAdjacentHTML('beforeend',`<circle cx="${x+30}" cy="${y+40}" r="30" fill="${c==='g'?'#0067F8':'#F5A623'}"/>`);
 c2.insertAdjacentHTML('beforeend',`<circle cx="${x+30}" cy="${y+40}" r="30" fill="#15CDD2"/>`+(c==='o'?`<circle cx="${x+30}" cy="${y+40}" r="38" fill="none" stroke="#F5A623" stroke-width="5"/>`:''));});
// img6 presence cards
const P=[['#3DBE7A','a'],['#F5C443','w'],['#9DB4C9','o'],['#3DBE7A','a'],['#003463','l'],['#3DBE7A','a']];
const icon={a:'<path d="M-14 0 l10 10 l20 -22" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
 w:'<rect x="-16" y="-12" width="32" height="24" rx="4" fill="none" stroke="#fff" stroke-width="5"/><rect x="-6" y="-20" width="24" height="18" rx="3" fill="#fff"/>',
 o:'<path d="M-18 -4 q18 -16 36 0 M-10 4 q10 -8 20 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><circle cy="12" r="4" fill="#fff"/><path d="M-18 -18 l36 36" stroke="#fff" stroke-width="5" stroke-linecap="round"/>',
 l:'<path d="M-16 -16 h14 v32 h-14z" fill="none" stroke="#fff" stroke-width="5"/><path d="M2 0 h18 M12 -9 l9 9 l-9 9" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'};
const pg=document.getElementById('pres');
P.forEach(([col,k],i)=>{const x=(i%3)*270,y=Math.floor(i/3)*360;
 pg.insertAdjacentHTML('beforeend',`<g transform="translate(${x},${y})"><rect width="240" height="320" rx="28" fill="#fff" stroke="#003463" stroke-width="6"/>
 <circle cx="120" cy="100" r="44" fill="#BAF0F2"/><path d="M60 200 q0-50 60-50 q60 0 60 50" fill="#BAF0F2"/>
 <rect x="50" y="240" width="140" height="16" rx="8" fill="#DDF1FA"/>
 <g transform="translate(200,40)"><circle r="34" fill="${col}"/>${icon[k]}</g></g>`);});
</script></body></html>
